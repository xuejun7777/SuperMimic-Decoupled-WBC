num_steps_per_env: 24
utd: 0.4
replay_capacity: 1000
warmup_iters: 20
wm_pretrain_updates: 40
critic_pretrain_updates: 10
action_noise_init: 0.3
action_noise_final: 0.15
det_frac: 0.2
lr_final_ratio: 0.15
log_interval: 20
save_interval: 500
keep_only_best_and_last: true
use_tensorboard: true
world_model:
  hidden: !!python/tuple
  - 2048
  - 2048
  - 2048
  aux_hidden: !!python/tuple
  - 128
  - 128
  state_spec:
    dt: 0.02
    err_scale: !!python/tuple
    - 0.05
    - 0.1
    - 0.5
    - 1.0
    - 0.1
    - 2.0
    out_scale: !!python/tuple
    - 0.3
    - 0.5
    - 2.0
    - 0.01
    - 0.02
    - 0.02
    in_scale: !!python/tuple
    - 1.0
    - 1.0
    - 1.0
    - 2.0
    - 1.0
    - 5.0
    explicit_integration: true
    xi_offset: !!python/tuple
    - 0.8
    - 0.6
    - 0.0025
    - 0.0
    xi_scale: !!python/tuple
    - 0.2
    - 0.2
    - 0.0025
    - 5.0
  contact_loss_weight: 0.5
  impact_loss_weight: 10.0
  use_bf16_dynamics: true
wm_trainer:
  window_k: 8
  batch_size: 2048
  batches_per_update: 8
  lr: 0.0003
  weight_decay: 1.0e-05
  grad_clip_norm: 1.0
  use_mirror_augmentation: true
  use_cudagraph: true
actor:
  obs_dim: 60
  act_dim: 15
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  last_gain: 0.01
critic:
  in_dim: 88
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
policy_trainer:
  horizon: 24
  batch_size: 2048
  gamma: 0.99
  gae_lambda: 0.95
  actor_lr: 0.0002
  critic_lr: 0.0003
  betas: !!python/tuple
  - 0.9
  - 0.95
  grad_clip_norm: 1.0
  grad_clip_value: 0.1
  critic_grad_clip_norm: 1.0
  critic_epochs: 2
  critic_minibatches: 4
  critic_ema_tau: 0.02
  use_critic_bootstrap: true
  obs_noise_in_imagination: true
  ood_action_limit: 10.0
  ood_action_weight: 0.1
  use_mirror_augmentation: true
  symmetry_weight: 1.5
  sym_tau_low: 0.18
  sym_tau_high: 0.45
  sym_warmup_ratio: 0.45
  sym_ramp_ratio: 0.15
  use_cudagraph: true
